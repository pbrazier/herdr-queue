id = "herdr-drafts"
name = "Herdr Queue"
version = "0.2.1"
description = "Draft, queue, and send prompts to your AI coding agents from a dedicated terminal panel."
min_herdr_version = "0.9.3"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "install.sh"]

[[actions]]
id = "open"
title = "Open drafts"
contexts = ["pane"]
command = ["sh", "run.sh", "open"]

[[panes]]
id = "drafts"
title = "Drafts"
placement = "split"
command = ["sh", "run.sh", "tui"]
